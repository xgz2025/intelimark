name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: NextmarkKit tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path Packages/NextmarkKit 2>&1 | tee test.log

      - name: Check for warnings
        shell: bash
        run: scripts/check-warnings.sh test.log

      - name: Summarize failures
        if: failure()
        shell: bash
        run: grep -E "error:|✘|failed" test.log | head -80 || true

  app:
    name: Build ${{ matrix.scheme }}
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: Nextmark-iOS
            destination: generic/platform=iOS Simulator
          - scheme: Nextmark-macOS
            destination: generic/platform=macOS
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        shell: bash
        run: |
          set +e
          xcodebuild build \
            -project Nextmark.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | grep -E "^(\*\*|.*error:)"
          status=${PIPESTATUS[0]}
          exit $status

      - name: Check for warnings
        shell: bash
        run: scripts/check-warnings.sh build.log

      - name: Summarize failures
        if: failure()
        shell: bash
        run: grep -E "error:" build.log | sort -u | head -80 || true

  storekit:
    name: StoreKit tests
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Test in-app purchases
        shell: bash
        run: |
          set -o pipefail
          # The newest available iPhone simulator.
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [(runtime, d["udid"]) for runtime, list_ in devices.items() if "iOS" in runtime
                    for d in list_ if d["name"].startswith("iPhone")]
          print(sorted(phones)[-1][1])')
          echo "Simulator: $udid"
          xcodebuild test \
            -project Nextmark.xcodeproj \
            -scheme Nextmark-iOS \
            -destination "id=$udid" \
            -only-testing:StoreKitTests-iOS \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee storekit.log | grep -E "^(\*\*|Test Case|.*error:)"

      - name: Check for warnings
        shell: bash
        run: scripts/check-warnings.sh storekit.log

      - name: Summarize failures
        if: failure()
        shell: bash
        run: grep -E "error:|failed" storekit.log | sort -u | head -80 || true

