name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: NextmarkKit tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path Packages/NextmarkKit 2>&1 | tee test.log

      - name: Check for warnings
        shell: bash
        run: scripts/check-warnings.sh test.log

      - name: Summarize failures
        if: failure()
        shell: bash
        run: grep -E "error:|✘|failed" test.log | head -80 || true

  app:
    name: Build ${{ matrix.scheme }}
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: Nextmark-iOS
            destination: generic/platform=iOS Simulator
          - scheme: Nextmark-macOS
            destination: generic/platform=macOS
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        shell: bash
        run: |
          set +e
          xcodebuild build \
            -project Nextmark.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | grep -E "^(\*\*|.*error:)"
          status=${PIPESTATUS[0]}
          exit $status

      - name: Check for warnings
        shell: bash
        run: scripts/check-warnings.sh build.log

      - name: Summarize failures
        if: failure()
        shell: bash
        run: grep -E "error:" build.log | sort -u | head -80 || true
